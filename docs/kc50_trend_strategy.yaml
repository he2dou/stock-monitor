meta:
  name: "科创50ETF 1-3年趋势策略"
  version: "2026-07-30"
  target:
    symbol: "588000"
    name: "科创50ETF"
    market: "A股"
    benchmark_index: "000688"
  horizon: "1-3 years"
  account_assumption:
    currency: "CNY"
    example_account_size: 100000
    target_max_position_pct: 0.30
    absolute_max_position_amount: 30000
  engine_compatibility:
    current_stock_monitor_supports: ["price", "change_pct"]
    required_for_full_strategy:
      - "ma_20d"
      - "ma_60d"
      - "ma_120d"
      - "ma_250d"
      - "ma_250d_slope_20d"
      - "drawdown_60d_high_pct"
      - "drawdown_250d_high_pct"
      - "trend_score"
      - "legacy_flag_spread"
    note: "当前 src.strategy_engine 只支持 price/change_pct 单字段触发；本文件是完整策略规格，不是当前引擎可直接完整执行的 YAML。"

feature_definitions:
  trend_score:
    description: "中长期趋势评分，满分 5 分。"
    rules:
      - "+1 if price > ma_60d"
      - "+1 if price > ma_120d"
      - "+1 if price > ma_250d"
      - "+1 if ma_60d > ma_120d"
      - "+1 if ma_250d_slope_20d > 0"
  legacy_flag_spread:
    description: "结合 StrategyMaSurgeTrend 旧策略思想：curflagshort - curflagavgshort。"
    bullish: "legacy_flag_spread > 0"
    bearish: "legacy_flag_spread < 0"
  lot_size:
    A股ETF: 100

strategies:
  - id: "kc50_trend_core_buy"
    enabled: true
    symbol: "588000"
    action: "buy"
    trigger:
      field: "trend_score"
      op: "above"
      value: 3
    sizing:
      type: "fixed_amount"
      amount: 3000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 43200
      max_position_amount: 30000
    filters:
      - field: "price"
        op: "above"
        value_ref: "ma_120d"
      - field: "ma_250d_slope_20d"
        op: "above"
        value: 0
    notes:
      - "核心仓建仓规则：趋势至少 4/5 分且价格站上中长期均线。"
      - "30 天冷却，避免在同一趋势段中过度频繁加仓。"

  - id: "kc50_pullback_buy_in_uptrend"
    enabled: true
    symbol: "588000"
    action: "buy"
    trigger:
      field: "drawdown_60d_high_pct"
      op: "below"
      value: -8.0
    sizing:
      type: "fixed_amount"
      amount: 2000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 10080
      max_position_amount: 30000
    filters:
      - field: "trend_score"
        op: "above"
        value: 3
      - field: "price"
        op: "above"
        value_ref: "ma_250d"
    notes:
      - "上升趋势中的回撤加仓，适合 1-3 年持有期降低平均成本。"
      - "如果价格跌破 250 日均线，不执行该回撤买入，避免接下跌趋势。"

  - id: "kc50_deep_pullback_recovery_buy"
    enabled: true
    symbol: "588000"
    action: "buy"
    trigger:
      field: "drawdown_250d_high_pct"
      op: "below"
      value: -25.0
    sizing:
      type: "fixed_amount"
      amount: 3000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 43200
      max_position_amount: 30000
    filters:
      - field: "price"
        op: "above"
        value_ref: "ma_20d"
      - field: "legacy_flag_spread"
        op: "above"
        value: 0
    notes:
      - "深度回撤后的恢复买入，不直接抄底，要求重新站上 20 日均线并由旧策略短期 flag 确认。"
      - "这是结合当前 StrategyMaSurgeTrend 的 OpenType=1 思路：curflagshort > curflagavgshort。"

  - id: "kc50_legacy_factor_confirm_buy"
    enabled: true
    symbol: "588000"
    action: "buy"
    trigger:
      field: "legacy_flag_spread"
      op: "above"
      value: 0
    sizing:
      type: "fixed_amount"
      amount: 1000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 10080
      max_position_amount: 30000
    filters:
      - field: "trend_score"
        op: "above"
        value: 2
      - field: "drawdown_60d_high_pct"
        op: "below"
        value: -5.0
    notes:
      - "小额试探仓，用旧策略短期信号作为确认，而不是单独满仓决策。"
      - "该规则权重较低，避免旧短线信号干扰 1-3 年主趋势框架。"

  - id: "kc50_trend_reduce_sell"
    enabled: true
    symbol: "588000"
    action: "sell"
    trigger:
      field: "trend_score"
      op: "below"
      value: 2
    sizing:
      type: "fixed_amount"
      amount: 5000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 10080
      max_position_amount: null
    filters:
      - field: "price"
        op: "below"
        value_ref: "ma_120d"
    notes:
      - "趋势明显走弱时减仓，不做一次性清仓。"
      - "适合保护 1-3 年策略的回撤。"

  - id: "kc50_defensive_exit_sell"
    enabled: true
    symbol: "588000"
    action: "sell"
    trigger:
      field: "price_to_ma250_pct"
      op: "below"
      value: -8.0
    sizing:
      type: "fixed_amount"
      amount: 10000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 43200
      max_position_amount: null
    filters:
      - field: "legacy_flag_spread"
        op: "below"
        value: 0
    notes:
      - "防守退出：价格显著跌破 250 日均线，且旧策略短期 flag 转弱。"
      - "不是预测底部，而是先降低趋势破坏时的风险敞口。"

current_engine_approximation:
  note: "以下规则只使用当前 stock-monitor 已支持的 change_pct 字段，只能作为临时近似，不能替代完整 1-3 年趋势策略。"
  strategies:
    - id: "kc50_daily_panic_small_buy"
      enabled: false
      symbol: "588000"
      action: "buy"
      trigger:
        field: "change_pct"
        op: "below"
        value: -4.0
      sizing:
        type: "fixed_amount"
        amount: 1000
        currency: "CNY"
        lot_size: 100
      constraints:
        cooldown_minutes: 10080
        max_position_amount: 10000
    - id: "kc50_daily_crash_buy"
      enabled: false
      symbol: "588000"
      action: "buy"
      trigger:
        field: "change_pct"
        op: "below"
        value: -8.0
      sizing:
        type: "fixed_amount"
        amount: 2000
        currency: "CNY"
        lot_size: 100
      constraints:
        cooldown_minutes: 43200
        max_position_amount: 20000
