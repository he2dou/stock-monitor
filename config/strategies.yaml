strategies:
  - id: "soxl_drop_buy"
    enabled: false
    symbol: "SOXL"
    action: "buy"
    trigger:
      field: "change_pct"
      op: "below"
      value: -15.0
    sizing:
      type: "fixed_amount"
      amount: 1000
      currency: "USD"
      lot_size: 1
    constraints:
      cooldown_minutes: 300
      max_position_amount: 5000
  - id: "xphx_drop_buy"
    enabled: false
    symbol: "159995"
    action: "buy"
    trigger:
      field: "change_pct"
      op: "below"
      value: -3.0
    sizing:
      type: "fixed_amount"
      amount: 1000
      currency: "CNY"
      lot_size: 100
    constraints:
      cooldown_minutes: 300
      max_position_amount: 5000
  # 突破回踩策略模板：长期下跌后，突破压力位，回踩确认支撑有效后买入。
  # 使用前必须按标的实际形态修改 resistance，并将 enabled 改为 true。
  - id: "soxl_breakout_pullback"
    type: "breakout_pullback"
    enabled: true
    symbol: "SOXL"
    action: "buy"
    breakout_pullback:
      resistance: 100.0
      breakout_buffer_pct: 1.0       # 价格高于压力位 1% 视为有效突破
      pullback_tolerance_pct: 1.0    # 回踩到压力位上下 1% 区间视为触及支撑
      confirmation_pct: 0.3          # 回踩后重新站上压力位 0.3% 触发买入
      max_pullback_bars: 8           # 突破后最多等待 8 个轮询周期回踩
      invalidation_pct: 2.0          # 跌破压力位下方 2% 视为支撑失败，重置等待
    sizing:
      type: "fixed_amount"
      amount: 1000
      currency: "USD"
      lot_size: 1
    constraints:
      cooldown_minutes: 300
      max_position_amount: 5000
  # SOXL 专用突破回踩策略模板：使用动态压力位、趋势过滤、按账户风险百分比下单、分批止盈和移动止损。
  # 该策略适合高波动杠杆 ETF，启用前建议先用历史 quote_snapshots 回测并确认参数。
  - id: "soxl_leveraged_breakout_pullback"
    type: "leveraged_breakout_pullback"
    enabled: false
    symbol: "SOXL"
    action: "buy"
    leveraged_breakout_pullback:
      lookback_bars: 30              # 用最近 30 个轮询价格寻找动态压力位
      breakout_buffer_pct: 0.75      # 高于动态压力位 0.75% 视为有效突破
      pullback_tolerance_pct: 7.0    # 回踩到压力位上下 7% 区间视为测试支撑
      confirmation_pct: 0.0          # 回踩后重新站上压力位即确认
      max_pullback_bars: 12          # 突破后最多等待 12 个轮询周期完成回踩
      invalidation_pct: 6.0          # 跌破压力位下方 6% 视为支撑失败
      trend_short_bars: 12           # 短周期均线过滤
      trend_long_bars: 50            # 长周期均线过滤，短均线必须高于长均线
      partial_take_profit_r: 2.5     # 达到 2.5R 先卖出一部分
      partial_sell_fraction: 0.5     # 分批止盈卖出当前持仓的 50%
      trailing_stop_pct: 22.0        # 剩余持仓使用最高价回撤 22% 移动止损
    sizing:
      type: "risk_percent"          # 按账户现金风险百分比计算数量
      amount: 2.0                    # 单笔最大风险为 USD 账户现金的 2%
      currency: "USD"
      lot_size: 1
    constraints:
      cooldown_minutes: 0
      max_position_amount: 50000
