# 应用程序配置
monitor:
  interval_minutes: 10

# Webhook 通知渠道配置（钉钉 / 飞书 / 企业微信 等）
# webhook_url 留空则不启用推送。
# 环境变量 WEBHOOK_URL 可覆盖此处的值（优先级：环境变量 > 配置文件）。
webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/782baaad-2e8c-488a-b937-36738f420eb7"
webhook_timeout: 10

# 大盘指数每日快照：A股/港股/美股各三大指数，运行中动态加载。
market_indices:
  enabled: true

paper_trading:
  enabled: true
  db_path: "data/trading.sqlite3"
  quote_history_enabled: true
  accounts:
    CNY: 100000
    HKD: 100000
    USD: 50000

# 后台管理系统
web:
  host: "127.0.0.1"
  port: 8000
  secret_key: ""
  admin_password: ""
  # 多用户配置（可选，优先于 admin_password）
  # users:
  #   - username: "admin"
  #     password_hash: "pbkdf2$200000$...$..."
  #     display_name: "管理员"
  # 密码哈希可通过 python -c "from src.web.auth import hash_password; print(hash_password('your_password'))" 生成
