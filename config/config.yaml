# 应用程序配置
monitor:
  interval_minutes: 10

# Webhook 通知渠道配置（钉钉 / 飞书 / 企业微信 等）
# webhook_url 留空则不启用推送。
# 环境变量 WEBHOOK_URL 可覆盖此处的值（优先级：环境变量 > 配置文件）。
webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/782baaad-2e8c-488a-b937-36738f420eb7"
webhook_timeout: 10

# 大盘指数每日快照：A股/港股/美股各三大指数，运行中动态加载。
market_indices:
  enabled: true

paper_trading:
  enabled: true
  db_path: "data/trading.sqlite3"
  quote_history_enabled: true
  accounts:
    CNY: 100000
    HKD: 100000
    USD: 50000

# 后台管理系统
web:
  host: "127.0.0.1"
  port: 8000
  # 会话签名密钥；留空则启动时随机生成（重启后已登录会话失效）
  secret_key: ""
  # 后台登录密码；留空则关闭登录校验（仅适合本地环境，勿暴露公网）
  admin_password: ""
