<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码 — Stock Monitor</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="login-wrap">
  <form class="card login" method="post" action="/change-password">
    <div class="login-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h1>修改密码</h1>
    </div>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>原密码
      <input type="password" name="old_password" autofocus required>
    </label>
    <label>新密码
      <input type="password" name="new_password" required>
    </label>
    <label>确认新密码
      <input type="password" name="confirm_password" required>
    </label>
    <button class="btn primary" type="submit">保存</button>
    <a href="/" class="login-back">返回首页</a>
  </form>
</div>
</body>
</html>
