{% extends "base.html" %}
{% block content %}
<section>
  <h2>操作</h2>
  <div class="ops-grid">
    <form method="post" action="/ops/update-snapshots">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="target" value="stock"><button class="btn primary" type="submit">更新股票快照</button></form>
    <form method="post" action="/ops/update-snapshots">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="target" value="index"><button class="btn primary" type="submit">更新指数快照</button></form>
    {% if has_monitor %}<form method="post" action="/ops/run-now">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn primary" type="submit">立即执行监控轮询</button></form>{% endif %}
  </div>
</section>
<section>
  <h2>抓取K线</h2>
  <form class="row-form" method="post" action="/ops/fetch-kline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <select name="symbol" id="klineSymbol">
      <option value="">— 选择代码 —</option>
      {% for sym in symbols %}<option value="{{ sym }}">{{ sym }}</option>{% endfor %}
    </select>
    <select name="market" id="klineMarket">
      <option value="美股">美股</option>
      <option value="港股">港股</option>
      <option value="A股">A股</option>
    </select>
    <select name="provider" id="klineProvider"><option value="akshare">akshare</option><option value="yahoo">yahoo</option><option value="nasdaq">nasdaq</option></select>
    <input name="start" type="date" value="{{ kline_start }}" required>
    <input name="end" type="date" value="{{ kline_end }}" required>
    <button class="btn primary" type="submit">抓取</button>
  </form>
  <script>
    // 选中代码时自动填充对应市场; A股时锁定 provider 为 akshare
    (function () {
      var symbolEl = document.getElementById('klineSymbol');
      var marketEl = document.getElementById('klineMarket');
      var providerEl = document.getElementById('klineProvider');
      var symbolMarkets = {{ symbol_markets | tojson }};

      function updateMarket() {
        var sym = symbolEl.value;
        if (sym && symbolMarkets[sym]) {
          marketEl.value = symbolMarkets[sym];
        }
        syncProvider();
      }

      function syncProvider() {
        if (marketEl.value === 'A股') {
          providerEl.value = 'akshare';
          providerEl.disabled = true;
        } else {
          providerEl.disabled = false;
        }
      }

      symbolEl.addEventListener('change', updateMarket);
      marketEl.addEventListener('change', syncProvider);
      // 页面加载时如果已有预选值则同步
      if (symbolEl.value) updateMarket();
    })();
  </script>
</section>
<section>
  <h2>日志（最后 200 行）</h2>
  <pre class="log">{{ log_tail }}</pre>
</section>
{% endblock %}
